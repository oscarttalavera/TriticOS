name: Deploy static content to Pages

on:
  push:
    branches: ["main", "master"]
  # Refresca el tipo de cambio USD DOF (México es UTC-6 sin horario de verano): 07:00 a 10:00 y 13:00.
  schedule:
    - cron: "0 13,14,15,16,19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Fetch USD DOF rate
        # Si Banxico no responde se conserva el último usd-dof.json del repositorio.
        run: npm run fetch:rate

      - name: Build
        run: npm run build
        
      - name: Copy CNAME and 404
        run: |
          cp public/CNAME dist/CNAME 2>/dev/null || :
          cp public/404.html dist/404.html 2>/dev/null || :
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
